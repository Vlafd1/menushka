<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>МЕНЮШКА — Меню та закупівлі</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f97316">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            orange: {
              500: '#F97316',
              600: '#EA580C',
            }
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body, html {
      background-color: #0f1013;
      overflow-x: hidden;
      width: 100%;
    }

    html:not(.dark) body, html:not(.dark) {
      background-color: #f8fafc;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    body.modal-open {
      overflow: hidden !important;
    }

    .theme-transition * {
      transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
    }
  </style>
</head>
<body class="theme-transition min-h-screen text-zinc-900 dark:text-zinc-100 flex justify-center selection:bg-orange-500/20">

  <!-- Головний мобільний контейнер -->
  <div class="w-full max-w-md min-h-screen flex flex-col relative pb-32">
    
    <!-- ЄДИНА ФІКСОВАНА ВЕРХНЯ ОБОРТКА (ШАПКА + КАТЕГОРІЇ) ЧЕРЕЗ FIXED -->
    <header class="fixed top-0 left-0 right-0 z-40 w-full bg-white dark:bg-[#121316] border-b border-zinc-200 dark:border-zinc-800 shadow-sm transition-colors">
      <div class="max-w-md mx-auto w-full">
        <!-- Верхній рядок: Логотип МЕНЮШКА та кнопки -->
        <div class="flex items-center justify-between gap-3 px-4 py-3">
          <!-- Логотип -->
          <div class="flex items-center">
            <span class="text-xl font-black tracking-tight text-zinc-900 dark:text-white uppercase select-none">
              МЕНЮШКА
            </span>
          </div>

          <!-- Кнопки керування (строго однакова висота h-10) -->
          <div class="flex items-center gap-3 shrink-0">
            <!-- Кнопка зміни теми -->
            <button 
              type="button" 
              id="themeToggleBtn" 
              aria-label="Перемкнути тему"
              class="w-10 h-10 rounded-full flex items-center justify-center bg-zinc-100 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300 border border-zinc-300 dark:border-zinc-700 active:scale-95 transition-all shrink-0"
            >
              <i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i>
              <i data-lucide="sun" class="w-5 h-5 block dark:hidden"></i>
            </button>

            <!-- Кнопка «+ Новий рецепт» -->
            <button 
              type="button" 
              id="openNewRecipeBtn"
              class="h-10 px-4 rounded-xl bg-orange-500 active:bg-orange-600 text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow-md shadow-orange-500/20 active:scale-95 transition-all whitespace-nowrap shrink-0"
            >
              + Новий рецепт
            </button>
          </div>
        </div>

        <!-- Горизонтальна панель швидких категорій -->
        <div data-categories-nav class="flex items-center gap-2 px-4 py-2 border-t border-zinc-100 dark:border-zinc-800/60">
          <!-- Скролящийся список категорій -->
          <div class="flex-1 flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5">
            <div id="categoryTabsContainer" class="flex items-center gap-2"></div>
          </div>

          <!-- Фіксована компактна квадратна кнопка з плюсиком праворуч -->
          <button 
            type="button" 
            id="openCategoriesModalBtn" 
            title="Керувати категоріями"
            aria-label="Керувати категоріями"
            class="w-8 h-8 shrink-0 flex items-center justify-center rounded-xl bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 text-zinc-600 dark:text-zinc-300 border border-zinc-200 dark:border-zinc-700/60 active:scale-95 transition-all"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 4v16m8-8H4"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- СТРІЧКА СТРАВ (ОСНОВНИЙ КОНТЕНТ З КОМПЕНСАЦІЄЮ ВІДСТУПУ PT-28) -->
    <main id="menuFeed" class="flex-1 px-4 pt-28 pb-4 space-y-6">
      <!-- Секції страв рендеряться динамічно -->
    </main>

    <!-- ПЛАВАЮЧА КНОПКА «СПИСОК ЗАКУПІВЛІ» -->
    <div class="fixed bottom-4 inset-x-0 z-30 flex justify-center px-4 pointer-events-none">
      <button 
        type="button" 
        id="openShoppingModalBtn" 
        class="pointer-events-auto w-full max-w-md bg-orange-500 active:bg-orange-600 text-white rounded-2xl py-3 px-4 shadow-xl shadow-orange-500/30 flex items-center justify-between font-bold text-sm transition-transform active:scale-98"
      >
        <span class="flex items-center gap-2">
          <i data-lucide="shopping-bag" class="w-5 h-5"></i>
          <span>Список закупівлі</span>
        </span>
        <span id="floatingCartBadge" class="bg-white/20 px-2.5 py-1 rounded-xl text-xs">0 страв</span>
      </button>
    </div>

  </div>

  <!-- ================= МОДАЛЬНІ ВІКНА (CENTRAL DIALOGS) ================= -->

  <!-- 1. МОДАЛЬНЕ ВІКНО РЕЦЕПТА (ДЕТАЛІ) -->
  <div id="recipeModal" class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-200">
    <div class="relative w-full max-w-md max-h-[85vh] bg-white dark:bg-[#16181d] border border-zinc-200 dark:border-zinc-800 rounded-3xl shadow-2xl flex flex-col overflow-hidden overscroll-contain transition-transform duration-200 scale-95">
      
      <!-- Хедер з фото -->
      <div class="relative h-48 w-full bg-zinc-200 dark:bg-zinc-800 shrink-0">
        <img id="modalRecipeImage" src="" alt="Фото страви" class="w-full h-full object-cover">
        <div id="modalRecipePlaceholder" class="w-full h-full flex items-center justify-center bg-zinc-200 dark:bg-zinc-800">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-orange-500 stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
            <circle cx="12" cy="13" r="3"/>
          </svg>
        </div>
        <button type="button" class="close-modal-btn absolute top-3 right-3 w-8 h-8 rounded-full bg-black/50 text-white flex items-center justify-center backdrop-blur-sm active:scale-90 transition-transform">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
        <span id="modalRecipeTime" class="absolute bottom-3 left-3 bg-black/60 backdrop-blur-sm text-white px-2 py-0.5 rounded-lg text-xs font-semibold flex items-center gap-1"></span>
      </div>

      <!-- Інфо та таби -->
      <div class="p-4 flex flex-col flex-1 overflow-hidden">
        <span id="modalRecipeCategory" class="text-xs font-bold uppercase tracking-wider text-orange-500"></span>
        <h3 id="modalRecipeTitle" class="text-lg font-bold text-zinc-900 dark:text-white mt-0.5 mb-3"></h3>

        <!-- Перемикач табів: Інгредієнти / Приготування -->
        <div class="grid grid-cols-2 gap-1.5 p-1 bg-zinc-100 dark:bg-zinc-800/80 rounded-xl mb-3 shrink-0">
          <button type="button" id="tabBtnIngredients" class="py-1.5 text-xs font-bold rounded-lg text-white bg-orange-500 transition-all">
            Інгредієнти
          </button>
          <button type="button" id="tabBtnInstructions" class="py-1.5 text-xs font-bold rounded-lg text-zinc-600 dark:text-zinc-400 transition-all">
            Приготування
          </button>
        </div>

        <!-- Контент табів -->
        <div class="flex-1 overflow-y-auto overscroll-contain pr-1 space-y-2 text-sm text-zinc-700 dark:text-zinc-300">
          <ul id="modalRecipeIngredients" class="divide-y divide-zinc-100 dark:divide-zinc-800/60"></ul>
          <div id="modalRecipeInstructions" class="hidden whitespace-pre-line leading-relaxed text-xs sm:text-sm"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 2. МОДАЛЬНЕ ВІКНО «СПИСОК ЗАКУПІВЛІ» -->
  <div id="shoppingModal" class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-200">
    <div class="relative w-full max-w-md max-h-[85vh] bg-white dark:bg-[#16181d] border border-zinc-200 dark:border-zinc-800 rounded-3xl shadow-2xl flex flex-col overflow-hidden overscroll-contain transition-transform duration-200 scale-95">
      
      <!-- Шапка модалки -->
      <div class="p-4 border-b border-zinc-200 dark:border-zinc-800 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2">
          <i data-lucide="shopping-bag" class="w-5 h-5 text-orange-500"></i>
          <h3 class="font-bold text-base text-zinc-900 dark:text-white">Список закупівлі</h3>
        </div>
        <button type="button" class="close-modal-btn w-8 h-8 rounded-full bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-400 flex items-center justify-center active:scale-90 transition-transform">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Контент списку (згідно з відділами) -->
      <div id="shoppingListContent" class="flex-1 overflow-y-auto overscroll-contain p-4 space-y-4">
        <!-- Створюється через JS -->
      </div>

      <!-- Нижня панель дій: Telegram та Копіювати -->
      <div class="p-4 border-t border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-[#121316] flex gap-2 shrink-0">
        <button 
          type="button" 
          id="telegramExportBtn" 
          class="flex-1 bg-[#229ED9] active:bg-[#1c8ec4] text-white font-bold py-2.5 px-3 rounded-xl text-xs flex items-center justify-center gap-2 transition-transform active:scale-95 shadow-md shadow-[#229ED9]/20"
        >
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .36z"/>
          </svg>
          <span>В Telegram</span>
        </button>
        <button 
          type="button" 
          id="copyShoppingListBtn" 
          class="bg-zinc-200 dark:bg-zinc-800 active:bg-zinc-300 dark:active:bg-zinc-700 text-zinc-800 dark:text-zinc-200 font-bold py-2.5 px-3.5 rounded-xl text-xs flex items-center justify-center gap-1.5 transition-transform active:scale-95"
        >
          <i data-lucide="copy" class="w-4 h-4"></i>
          <span>Копіювати</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 3. МОДАЛЬНЕ ВІКНО «ДОДАТИ СВІЙ РЕЦЕПТ» -->
  <div id="newRecipeModal" class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-200">
    <div class="relative w-full max-w-md max-h-[85vh] bg-white dark:bg-[#16181d] border border-zinc-200 dark:border-zinc-800 rounded-3xl shadow-2xl flex flex-col overflow-hidden overscroll-contain transition-transform duration-200 scale-95">
      
      <!-- Шапка -->
      <div class="p-4 border-b border-zinc-200 dark:border-zinc-800 flex items-center justify-between shrink-0">
        <h3 id="recipeModalFormTitle" class="font-bold text-base text-zinc-900 dark:text-white">Додати свій рецепт</h3>
        <button type="button" class="close-modal-btn w-8 h-8 rounded-full bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-400 flex items-center justify-center active:scale-90 transition-transform">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Тіло форми -->
      <form id="newRecipeForm" class="flex-1 overflow-y-auto overflow-x-hidden overscroll-contain p-4 space-y-4">
        <input type="hidden" id="editingRecipeId" value="">

        <!-- Назва страви -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-zinc-500 mb-1">Назва страви *</label>
          <input type="text" id="recipeTitleInput" required placeholder="Напр. Паста з креветками" class="w-full bg-zinc-100 dark:bg-[#20232a] border border-zinc-300 dark:border-zinc-700 rounded-xl px-3 py-2 text-sm text-zinc-900 dark:text-white focus:outline-none focus:border-orange-500">
        </div>

        <!-- Категорія та Час приготування -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-zinc-500 mb-1">Категорія *</label>
          <select id="recipeCategorySelect" required class="w-full bg-zinc-100 dark:bg-[#20232a] border border-zinc-300 dark:border-zinc-700 rounded-xl px-3 py-2 text-sm text-zinc-900 dark:text-white focus:outline-none focus:border-orange-500"></select>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-zinc-500 mb-1">Кількість порцій *</label>
            <input type="number" id="recipePortionsInput" required min="1" step="1" placeholder="Напр. 2" class="w-full bg-zinc-100 dark:bg-[#20232a] border border-zinc-300 dark:border-zinc-700 rounded-xl px-3 py-2 text-sm text-zinc-900 dark:text-white focus:outline-none focus:border-orange-500">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-zinc-500 mb-1">Час (хв)</label>
            <input type="number" id="recipeTimeInput" min="1" max="300" placeholder="Напр. 25" class="w-full bg-zinc-100 dark:bg-[#20232a] border border-zinc-300 dark:border-zinc-700 rounded-xl px-3 py-2 text-sm text-zinc-900 dark:text-white focus:outline-none focus:border-orange-500">
          </div>
        </div>

        <!-- Фото страви (опціонально) -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-zinc-500 mb-1">Фото страви (опціонально)</label>
          <div class="flex items-center gap-3">
            <div id="imagePreviewBox" class="w-14 h-14 rounded-xl border border-dashed border-zinc-300 dark:border-zinc-700 flex items-center justify-center overflow-hidden bg-zinc-100 dark:bg-[#20232a] shrink-0">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-orange-500 stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
                <circle cx="12" cy="13" r="3"/>
              </svg>
            </div>
            <label class="flex-1 cursor-pointer bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 text-zinc-700 dark:text-zinc-300 px-3 py-2 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 border border-zinc-300 dark:border-zinc-700 transition-colors">
              <i data-lucide="upload" class="w-4 h-4"></i>
              <span id="uploadLabelText">Обрати фото...</span>
              <input type="file" id="recipeImageFileInput" accept="image/*" class="hidden">
            </label>
          </div>
        </div>

        <!-- Інгредієнти -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label id="ingredientsBlockLabel" class="text-xs font-bold uppercase tracking-wider text-zinc-500">Інгредієнти (на 1 порц.) *</label>
            <button type="button" id="addIngredientRowBtn" class="text-xs font-bold text-orange-500 hover:underline flex items-center gap-1">
              + Додати рядок
            </button>
          </div>
          <div id="ingredientsListContainer" class="space-y-2"></div>
        </div>

        <!-- Покроковий рецепт -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-zinc-500 mb-1">Інструкція приготування</label>
          <textarea id="recipeInstructionsInput" rows="3" placeholder="1. Зварити пасту...&#10;2. Обсмажити креветки..." class="w-full bg-zinc-100 dark:bg-[#20232a] border border-zinc-300 dark:border-zinc-700 rounded-xl px-3 py-2 text-xs leading-relaxed text-zinc-900 dark:text-white focus:outline-none focus:border-orange-500"></textarea>
        </div>

        <!-- Нижня кнопка збереження -->
        <div class="pt-2">
          <button type="submit" class="w-full bg-orange-500 active:bg-orange-600 text-white font-bold py-2.5 rounded-xl text-sm shadow-md shadow-orange-500/20 active:scale-98 transition-all">
            Зберегти рецепт
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 4. МОДАЛЬНЕ ВІКНО «КЕРУВАННЯ КАТЕГОРІЯМИ» -->
  <div id="categoriesModal" class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-200">
    <div class="relative w-full max-w-md max-h-[85vh] bg-white dark:bg-[#16181d] border border-zinc-200 dark:border-zinc-800 rounded-3xl shadow-2xl flex flex-col overflow-hidden overscroll-contain transition-transform duration-200 scale-95">
      
      <!-- Шапка -->
      <div class="p-4 border-b border-zinc-200 dark:border-zinc-800 flex items-center justify-between shrink-0">
        <h3 class="font-bold text-base text-zinc-900 dark:text-white">Категорії страв</h3>
        <button type="button" class="close-modal-btn w-8 h-8 rounded-full bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-400 flex items-center justify-center active:scale-90 transition-transform">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="p-4 flex-1 overflow-y-auto overscroll-contain space-y-4">
        <!-- Блок створення нової категорії -->
        <div class="bg-zinc-50 dark:bg-[#1a1c21] p-3 rounded-2xl border border-zinc-200 dark:border-zinc-800 space-y-2">
          <span class="text-xs font-bold uppercase tracking-wider text-orange-500 flex items-center gap-1.5">
            <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> Створити нову категорію
          </span>

          <div class="flex gap-2 items-center">
            <!-- Квадратне поле для емодзі з контурним SVG-плейсхолдером -->
            <div class="relative flex items-center justify-center w-12 h-10 bg-zinc-100 dark:bg-[#20232a] border border-zinc-300 dark:border-zinc-700 rounded-xl overflow-hidden focus-within:border-orange-500 transition-colors shrink-0">
              <input 
                type="text" 
                id="newCatIconInput" 
                maxlength="2" 
                class="w-full h-full text-center bg-transparent text-lg font-medium text-zinc-900 dark:text-white outline-none z-10 cursor-pointer"
              >
              <div id="newCatIconPlaceholder" class="absolute inset-0 flex items-center justify-center pointer-events-none text-zinc-400 dark:text-zinc-500 z-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10" />
                  <path d="M8 14s1.5 2 4 2 4-2 4-2" />
                  <line x1="9" y1="9" x2="9.01" y2="9" />
                  <line x1="15" y1="9" x2="15.01" y2="9" />
                </svg>
              </div>
            </div>

            <!-- Поле назви категорії -->
            <input 
              type="text" 
              id="newCatNameInput" 
              placeholder="Назва (напр. Мангал, Закуски)" 
              class="flex-1 bg-zinc-100 dark:bg-[#20232a] border border-zinc-300 dark:border-zinc-700 rounded-xl px-3 py-2 text-sm text-zinc-900 dark:text-white focus:outline-none focus:border-orange-500"
            >

            <!-- Кнопка створення з галочкою Check -->
            <button 
              type="button"

    // Безпечне отримання користувацьких інгредієнтів
    const getStoredIngredients = () => {
      try {
        const saved = localStorage.getItem('menushka_custom_ingredients');
        const parsed = saved ? JSON.parse(saved) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        console.error("Помилка читання localStorage custom_ingredients:", e);
        return [];
      }
    };

    // Збереження користувацького інгредієнта з автоматичним російським аліасом
    function saveCustomIngredient(name, categoryOrAisleKey) {
      if (!name || !name.trim()) return;
      const cleanName = name.trim();
      
      // Визначаємо текстову назву категорії
      const categoryName = AISLE_KEY_TO_CATEGORY[categoryOrAisleKey] || categoryOrAisleKey || "Інше";

      const list = getStoredIngredients();
      const existingIdx = list.findIndex(p => p.name.toLowerCase() === cleanName.toLowerCase());

      // Простий російський аліас (транслітерація і -> и, є -> е, ї -> и)
      const ruAlias = cleanName.toLowerCase()
        .replace(/і/g, 'и')
        .replace(/є/g, 'е')
        .replace(/ї/g, 'и');

      const aliases = [cleanName.toLowerCase()];
      if (ruAlias !== cleanName.toLowerCase()) {
        aliases.push(ruAlias);
      }

      if (existingIdx >= 0) {
        list[existingIdx].category = categoryName;
        if (!Array.isArray(list[existingIdx].aliases)) list[existingIdx].aliases = [];
        aliases.forEach(a => {
          if (!list[existingIdx].aliases.includes(a)) list[existingIdx].aliases.push(a);
        });
      } else {
        list.push({
          name: cleanName,
          category: categoryName,
          aliases: aliases
        });
      }

      try {
        localStorage.setItem('menushka_custom_ingredients', JSON.stringify(list));
      } catch (e) {
        console.error("Помилка запису в localStorage custom_ingredients:", e);
      }
    }

    // Безпечний пошук для автокомпліту за назвою та аліасами
    const searchIngredients = (query) => {
      const cleanQuery = (query || "").trim().toLowerCase();
      if (!cleanQuery) return [];

      const customList = getStoredIngredients();
      const allItems = [...DEFAULT_INGREDIENTS, ...customList];

      // Видаляємо дублікати за назвою, віддаючи перевагу користувацьким записам
      const uniqueMap = new Map();
      allItems.forEach(item => {
        if (item && item.name) {
          uniqueMap.set(item.name.toLowerCase(), item);
        }
      });
      const uniqueItems = Array.from(uniqueMap.values());

      return uniqueItems.filter(item => {
        if (!item || !item.name) return false;
        const nameMatch = item.name.toLowerCase().includes(cleanQuery);
        const aliasMatch = Array.isArray(item.aliases) && item.aliases.some(
          alias => typeof alias === "string" && alias.toLowerCase().includes(cleanQuery)
        );
        return nameMatch || aliasMatch;
      }).slice(0, 7); // Максимум 7 підказок
    };

    function detectAisleByName(name = "", explicitAisle = "") {
      const lower = (name || "").toLowerCase().trim();

      // Перевіряємо базу DEFAULT_INGREDIENTS
      const defaultMatch = DEFAULT_INGREDIENTS.find(p => p && p.name && p.name.toLowerCase() === lower);
      if (defaultMatch && defaultMatch.category) {
        return CATEGORY_TO_AISLE_KEY[defaultMatch.category] || "other";
      }

      // 1. М'ясо
      if (
        lower.includes("м'яс") || lower.includes("мяс") || lower.includes("філе") ||
        lower.includes("филе") || lower.includes("курк") || lower.includes("куриц") ||
        lower.includes("куряч") || lower.includes("яловичин") || lower.includes("говядин") ||
        lower.includes("свинин") || lower.includes("бекон") || lower.includes("гуанчале") ||
        lower.includes("фарш") || lower.includes("стейк") || lower.includes("ковбас") ||
        lower.includes("колбас") || lower.includes("сосиск") || lower.includes("рібай") ||
        lower.includes("рибай") || lower.includes("індич") || lower.includes("индейк") ||
        lower.includes("шинк") || lower.includes("ветчин")
      ) {
        return "meat";
      }

      // 2. Консерви
      if (
        lower.includes("пелаті") || lower.includes("пелати") || lower.includes("консерв") ||
        (lower.includes("тунец") && (lower.includes("консерв") || lower.includes("сок") || lower.includes("банк"))) ||
        (lower.includes("тунц") && (lower.includes("консерв") || lower.includes("сок") || lower.includes("банк"))) ||
        lower.includes("оливк") || lower.includes("маслин") ||
        (lower.includes("квасол") && lower.includes("консерв")) ||
        (lower.includes("кукурудз") && lower.includes("консерв")) ||
        (lower.includes("горошок") && lower.includes("консерв"))
      ) {
        return "canned";
      }

      // 3. Риба
      if (
        lower.includes("риб") || lower.includes("рыб") || lower.includes("лосос") ||
        lower.includes("сьомг") || lower.includes("семг") || lower.includes("форел") ||
        lower.includes("кревет") || lower.includes("мідії") || lower.includes("мидии")
      ) {
        return "fish";
      }

      // 4. Молочні та яйця (включаючи сири)
      if (
        lower.includes("вершк") || lower.includes("сливк") || lower.includes("молок") ||
        lower.includes("сметан") || lower.includes("кефір") || lower.includes("кефир") ||
        lower.includes("масло вершков") || lower.includes("сливочное масло") ||
        lower.includes("яйц") || lower.includes("жовт") || lower.includes("желт") || lower.includes("білок") ||
        lower.includes("сир") || lower.includes("сыр") || lower.includes("пармезан") ||
        lower.includes("моцарел") || lower.includes("моцарелла") || lower.includes("фета") ||
        lower.includes("пекоріно") || lower.includes("пекорино") || lower.includes("маскарпоне") ||
        lower.includes("чеддер") || lower.includes("чедер") || lower.includes("сулугуні") ||
        lower.includes("сулугуни") || lower.includes("дорблю") || lower.includes("горгонзол") ||
        lower.includes("творог")
      ) {
        return "dairy";
      }

      // 5. Овочі та фрукти (овочі, зелень, гриби, фрукти, ягоди)
      if (
        lower.includes("томат") || lower.includes("помідор") || lower.includes("помидор") ||
        lower.includes("огірок") || lower.includes("огур") || lower.includes("печериц") ||
        lower.includes("шампиньон") || lower.includes("гриб") || lower.includes("базилік") ||
        lower.includes("базилик") || lower.includes("кріп") || lower.includes("укроп") ||
        lower.includes("розмарин") || lower.includes("часник") || lower.includes("чеснок") ||
        lower.includes("цибул") || lower.includes("лук") || lower.includes("картопл") ||
        lower.includes("картофел") || lower.includes("моркв") || lower.includes("морков") ||
        lower.includes("зелен") || lower.includes("салат") || lower.includes("шпинат") ||
        lower.includes("рукол") || lower.includes("ягід") || lower.includes("ягод") ||
        lower.includes("яблук") || lower.includes("яблок") || lower.includes("лимон") ||
        lower.includes("банан") || lower.includes("полуниц") || lower.includes("клубник") ||
        lower.includes("малин") || lower.includes("чорниц") || lower.includes("авокадо")
      ) {
        return "produce";
      }

      // 6. Випічка
      if (
        lower.includes("ванільн") || lower.includes("ванильн") || lower.includes("розпушувач") ||
        lower.includes("разрыхлитель") || lower.includes("шоколад") || lower.includes("дріждж") ||
        lower.includes("дрожжи") || lower.includes("какао") || lower.includes("сода")
      ) {
        return "bakery";
      }

      // 7. Спеції та олія
      if (
        lower.includes("олі") || lower.includes("масло оливков") || lower.includes("растительное масло") ||
        lower.includes("перець") || lower.includes("перец") || lower.includes("сіль") ||
        lower.includes("соль") || lower.includes("спеці") || lower.includes("специ") ||
        lower.includes("соус") || lower.includes("соєв") || lower.includes("соев") ||
        lower.includes("орегано")
      ) {
        return "spices";
      }

      // 8. Бакалія
      if (
        lower.includes("спагет") || lower.includes("паста") || lower.includes("макарон") ||
        lower.includes("борошн") || lower.includes("мука") || lower.includes("тісто") ||
        lower.includes("тесто") || lower.includes("цукор") || lower.includes("сахар") ||
        lower.includes("кава") || lower.includes("кофе") || lower.includes("савоярд") ||
        lower.includes("рис") || lower.includes("гречк") || lower.includes("вівсян") || lower.includes("овсян")
      ) {
        return "grocery";
      }

      if (explicitAisle) {
        if (explicitAisle === "vegetables" || explicitAisle === "fruits") return "produce";
        if (explicitAisle === "cheese") return "dairy";
        if (AISLES[explicitAisle]) return explicitAisle;
      }

      return "other";
    }

          { name: "Какао-порошок", amount: 10, unit: "г", aisle: "bakery" },
          { name: "Цукрова пудра", amount: 40, unit: "г", aisle: "grocery" }
        ]
      }
    ];

    let categories = JSON.parse(localStorage.getItem("chef_categories")) || DEFAULT_CATEGORIES;
    let recipes = JSON.parse(localStorage.getItem("chef_recipes")) || DEFAULT_RECIPES;

    // Автоматична міграція старих збережених рецептів на нові ключі категорій
    recipes.forEach(r => {
      if (Array.isArray(r.ingredients)) {
        r.ingredients.forEach(ing => {
          if (ing.aisle === "cheese") ing.aisle = "dairy";
          if (ing.aisle === "vegetables" || ing.aisle === "fruits") ing.aisle = "produce";
        });
      }
    });

    let selectedMenu = JSON.parse(localStorage.getItem("chef_menu")) || {};
    let excludedShoppingItems = new Set();
    let activeCategoryId = categories[0]?.id || "pasta";
    let activeModalsCount = 0;
    let uploadedImageBase64 = "";

    function saveCategories() {
      localStorage.setItem("chef_categories", JSON.stringify(categories));
    }
    function saveRecipes() {
      localStorage.setItem("chef_recipes", JSON.stringify(recipes));
    }
    function saveMenu() {
      localStorage.setItem("chef_menu", JSON.stringify(selectedMenu));
    }

    // 3. КЕРУВАННЯ ТЕМОЮ
    function setupTheme() {
      const savedTheme = localStorage.getItem("chef_theme") || "dark";
      if (savedTheme === "dark") {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }

      document.getElementById("themeToggleBtn").addEventListener("click", () => {
        const isDark = document.documentElement.classList.contains("dark");
        if (isDark) {
          document.documentElement.classList.remove("dark");
          localStorage.setItem("chef_theme", "light");
        } else {
          document.documentElement.classList.add("dark");
          localStorage.setItem("chef_theme", "dark");
        }
        updateTabsStyle();
      });
    }

    // 4. КЕРУВАННЯ МОДАЛЬНИМИ ВІКНАМИ (BODY SCROLL LOCK)
    function openModal(modalId) {
      const modal = document.getElementById(modalId);
      if (!modal) return;
      activeModalsCount++;
      document.body.classList.add("modal-open");
      document.body.style.overflow = "hidden";
      document.documentElement.style.overflow = "hidden";

      modal.classList.remove("opacity-0", "pointer-events-none");
      const dialog = modal.querySelector("div");
      if (dialog) {
        dialog.classList.remove("scale-95");
        dialog.classList.add("scale-100");
      }
    }

    function closeModal(modalId) {
      const modal = document.getElementById(modalId);
      if (!modal) return;
      const dialog = modal.querySelector("div");
      if (dialog) {
        dialog.classList.remove("scale-100");
        dialog.classList.add("scale-95");
      }
      modal.classList.add("opacity-0", "pointer-events-none");

      activeModalsCount = Math.max(0, activeModalsCount - 1);
      if (activeModalsCount === 0) {
        document.body.classList.remove("modal-open");
        document.body.style.overflow = "";
        document.documentElement.style.overflow = "";
      }
    }

    function setupModals() {
      document.querySelectorAll(".close-modal-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const modal = btn.closest(".fixed");
          if (modal) closeModal(modal.id);
        });
      });

      document.querySelectorAll(".fixed.inset-0").forEach(backdrop => {
        backdrop.addEventListener("click", (e) => {
          if (e.target === backdrop) {
            closeModal(backdrop.id);
          }
        });
      });
    }

    // 5. РЕНДЕРИНГ ТАБІВ ТА SCROLLSPY
    function renderCategoryTabs() {
      const container = document.getElementById("categoryTabsContainer");
      container.innerHTML = categories.map(cat => {
        const iconHtml = cat.icon ? `<span>${cat.icon}</span>` : "";
        return `
          <button 
            type="button" 
            data-cat-id="${cat.id}" 
            class="cat-pill flex-shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold active:scale-95 transition-all"
          >
            ${iconHtml}
            <span>${cat.name}</span>
          </button>
        `;
      }).join("");

      container.querySelectorAll(".cat-pill").forEach(btn => {
        btn.addEventListener("click", () => {
          const catId = btn.dataset.catId;
          const section = document.getElementById(`section-${catId}`);
          if (section) {
            const nav = document.querySelector("[data-categories-nav]");
            const offset = (nav?.getBoundingClientRect().bottom || 110) + 10;
            const top = section.getBoundingClientRect().top + window.scrollY - offset;
            window.scrollTo({ top, behavior: "smooth" });
          }
          activeCategoryId = catId;
          updateTabsStyle(true);
        });
      });

      updateTabsStyle();
    }

    function updateTabsStyle(scrollIntoView = false) {
      document.querySelectorAll("#categoryTabsContainer .cat-pill").forEach(btn => {
        const id = btn.dataset.catId;
        const isActive = id === activeCategoryId;
        if (isActive) {
          btn.className = "cat-pill flex-shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-orange-500 text-white shadow-md shadow-orange-500/20 active:scale-95 transition-all";
          if (scrollIntoView) {
            btn.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
          }
        } else {
          btn.className = "cat-pill flex-shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-zinc-100 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300 border border-zinc-200 dark:border-zinc-800 active:scale-95 transition-all";
        }
      });
    }

    function setupStrictScrollSpy() {
      window.addEventListener("scroll", () => {
        if (window.scrollY < 20) {
          if (categories[0] && activeCategoryId !== categories[0].id) {
            activeCategoryId = categories[0].id;
            updateTabsStyle(true);
          }
          return;
        }

        const navBar = document.querySelector("[data-categories-nav]");
        const navBottom = navBar ? navBar.getBoundingClientRect().bottom : 110;
        const zoneTop = navBottom;
        const zoneBottom = navBottom + 45;

        const titles = document.querySelectorAll(".category-title-trigger");
        titles.forEach(title => {
          const rect = title.getBoundingClientRect();
          if (rect.top <= zoneBottom && rect.bottom >= zoneTop) {
            const id = title.getAttribute("data-id");
            if (id && id !== activeCategoryId) {
              activeCategoryId = id;
              updateTabsStyle(true);
            }
          }
        });
      }, { passive: true });
    }

    // 6. РЕНДЕРИНГ СТРІЧКИ СТРАВ
    function renderMenuFeed() {
      const feed = document.getElementById("menuFeed");
      feed.innerHTML = categories.map(cat => {
        const catRecipes = recipes.filter(r => r.categoryId === cat.id);
        const iconHtml = cat.icon ? `<span>${cat.icon}</span>` : "";

        return `
          <section id="section-${cat.id}" class="space-y-3 pt-2">

              <h2 class="text-xs font-extrabold uppercase tracking-wider text-zinc-600 dark:text-zinc-400 flex items-center gap-1.5">
                ${iconHtml}
                <span>${cat.name}</span>

              <span class="text-[11px] font-bold text-zinc-400 bg-zinc-100 dark:bg-zinc-800 px-2 py-0.5 rounded-full">

                  <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>

          <!-- Інформація про страву -->

              <div class="flex items-center gap-1">
                <button type="button" class="edit-recipe-btn text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200 p-1.5 rounded-lg active:scale-90 transition-transform">
                  <i data-lucide="pencil" class="w-3.5 h-3.5"></i>

                ${isSelected ? `
                  <div class="flex items-center bg-orange-500 text-white rounded-xl overflow-hidden shadow-sm">
                    <button type="button" class="dec-btn px-2.5 py-1 text-sm font-bold active:bg-orange-600">−</button>
                    <span class="text-xs font-bold px-1">${count}</span>
                    <button type="button" class="inc-btn px-2.5 py-1 text-sm font-bold active:bg-orange-600">+</button>
                  </div>
                ` : `
                  <button type="button" class="inc-btn w-8 h-8 rounded-xl bg-orange-500/10 text-orange-500 active:bg-orange-500 active:text-white flex items-center justify-center font-bold text-base transition-colors">
                    +
                  </button>

    function bindRecipeCardEvents() {
      lucide.createIcons();

      document.querySelectorAll(".recipe-card").forEach(card => {
        const id = card.dataset.recipeId;
        const recipe = recipes.find(r => r.id === id);
        if (!recipe) return;

        card.querySelectorAll(".recipe-open-details").forEach(el => {
          el.addEventListener("click", () => openRecipeDetails(recipe));
        });

        const incBtn = card.querySelector(".inc-btn");
        if (incBtn) {
          incBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            selectedMenu[id] = (selectedMenu[id] || 0) + 1;
            saveMenu();
            renderMenuFeed();
            updateFloatingCartBadge();
          });
        }

        const decBtn = card.querySelector(".dec-btn");
        if (decBtn) {
          decBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (selectedMenu[id] > 1) {
              selectedMenu[id]--;
            } else {
              delete selectedMenu[id];
            }
            saveMenu();
            renderMenuFeed();
            updateFloatingCartBadge();
          });
        }

        const editBtn = card.querySelector(".edit-recipe-btn");
        if (editBtn) {
          editBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            openEditRecipeModal(recipe);
          });
        }
      });
    }

    function updateFloatingCartBadge() {
      const totalDishes = Object.values(selectedMenu).reduce((a, b) => a + b, 0);
      const badge = document.getElementById("floatingCartBadge");
      badge.innerText = `${totalDishes} ${pluralize(totalDishes, ['страва', 'страви', 'страв'])}`;
    }

    function pluralize(n, forms) {
      n = Math.abs(n) % 100;
      const n1 = n % 10;
      if (n > 10 && n < 20) return forms[2];
      if (n1 > 1 && n1 < 5) return forms[1];
      if (n1 === 1) return forms[0];
      return forms[2];
    }

      const placeholderEl = document.getElementById("modalRecipePlaceholder");

      if (recipe.image && recipe.image.trim().length > 0) {

    // 8. СПИСОК ЗАКУПІВЛІ ТА TELEGRAM
    function calculateShoppingData() {
      const aggregated = {};

      for (const [recipeId, portions] of Object.entries(selectedMenu)) {
        if (portions <= 0) continue;
        const recipe = recipes.find(r => r.id === recipeId);
        if (!recipe) continue;

        (recipe.ingredients || []).forEach(ing => {
          let matchedAisle = detectAisleByName(ing.name, ing.aisle);
          if (matchedAisle === "cheese") matchedAisle = "dairy";
          if (matchedAisle === "vegetables" || matchedAisle === "fruits") matchedAisle = "produce";
          const key = `${ing.name.toLowerCase().trim()}_${ing.unit}`;
          if (!aggregated[key]) {
            aggregated[key] = {
              name: ing.name.trim(),
              amount: 0,
              unit: ing.unit,
              aisle: matchedAisle
            };
          }
          aggregated[key].amount += (ing.amount * portions);
        });
      }

      // Новий затверджений порядок категорій:
      // М'ясо -> Овочі та фрукти -> Бакалія -> Молочні та яйця -> Консерви -> Риба -> Спеції та олія -> Випічка -> Інше
      const aisleOrder = ["meat", "produce", "grocery", "dairy", "canned", "fish", "spices", "bakery", "other"];
      const byAisle = {};

      aisleOrder.forEach(key => {
        const items = Object.values(aggregated).filter(item => item.aisle === key);
        if (items.length > 0) {
          byAisle[key] = items;
        }
      });

      return byAisle;
    }

    function renderShoppingListModal() {
      const grouped = calculateShoppingData();
      const container = document.getElementById("shoppingListContent");

      const aisleKeys = Object.keys(grouped);
      if (aisleKeys.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-zinc-400 dark:text-zinc-500 text-xs">Не обрано жодної страви</div>`;
        return;
      }

      container.innerHTML = aisleKeys.map(aisleKey => {
        const aisleInfo = AISLES[aisleKey] || AISLES.other;
        const items = grouped[aisleKey];

        return `
          <div class="bg-zinc-50 dark:bg-[#1a1c21] border border-zinc-200 dark:border-zinc-800 rounded-2xl p-3 space-y-2">
            <div class="flex items-center gap-2 border-b border-zinc-200 dark:border-zinc-800 pb-2">
              <span class="text-base">${aisleInfo.icon}</span>
              <h4 class="text-xs font-bold text-zinc-700 dark:text-zinc-300 uppercase tracking-wider">${aisleInfo.title}</h4>
            </div>

            <div class="space-y-1 pt-1">
              ${items.map(item => {
                const itemKey = `${item.name}_${item.unit}`;
                const isChecked = excludedShoppingItems.has(itemKey);
                return `
                  <label class="flex items-center justify-between p-1.5 rounded-lg active:bg-zinc-200/60 dark:active:bg-zinc-800/40 cursor-pointer text-xs select-none">
                    <div class="flex items-center gap-2">
                      <input type="checkbox" data-item-key="${itemKey}" ${isChecked ? "checked" : ""} class="shopping-item-toggle w-4 h-4 rounded border-zinc-300 dark:border-zinc-700 text-orange-500 focus:ring-0 bg-white dark:bg-[#20232a]">
                      <span class="${isChecked ? "line-through text-zinc-400 dark:text-zinc-600" : "text-zinc-800 dark:text-zinc-200 font-medium"}">${item.name}</span>
                    </div>
                    <span class="font-bold ${isChecked ? "text-zinc-400 dark:text-zinc-600" : "text-orange-500"}">${item.amount} ${item.unit}</span>
                  </label>
                `;
              }).join("")}
            </div>
          </div>
        `;
      }).join("");

      container.querySelectorAll(".shopping-item-toggle").forEach(chk => {
        chk.addEventListener("change", (e) => {
          const key = e.target.dataset.itemKey;
          if (e.target.checked) {
            excludedShoppingItems.add(key);
          } else {
            excludedShoppingItems.delete(key);
          }
          renderShoppingListModal();
        });
      });
    }

    function generateTelegramText() {
      const grouped = calculateShoppingData();
      let text = "🛒 СПИСОК ЗАКУПІВЛІ (МЕНЮШКА)\n";

      for (const [aisleKey, items] of Object.entries(grouped)) {
        const activeItems = items.filter(it => !excludedShoppingItems.has(`${it.name}_${it.unit}`));
        if (activeItems.length === 0) continue;

        const aisle = AISLES[aisleKey] || AISLES.other;
        text += `\n${aisle.title.toUpperCase()}:\n`;
        activeItems.forEach(it => {
          text += `◻️ ${it.name} — ${it.amount} ${it.unit}\n`;
        });
      }

      return text.trim();
    }

        </select>
        <select class="ing-aisle w-[115px] max-w-[120px] shrink-0 truncate bg-zinc-100 dark:bg-[#20232a] border border-zinc-300 dark:border-zinc-700 rounded-lg px-1.5 py-1.5 text-xs text-zinc-900 dark:text-white focus:outline-none focus:border-orange-500" title="Оберіть відділ...">
          <option value="" disabled ${!safeAisle ? "selected" : ""}>Відділ...</option>
          <option value="meat" ${safeAisle === "meat" ? "selected" : ""}>🥩 М'ясо</option>
          <option value="produce" ${safeAisle === "produce" ? "selected" : ""}>🥦 Овочі та фрукти</option>
          <option value="grocery" ${safeAisle === "grocery" ? "selected" : ""}>🍝 Бакалія</option>
          <option value="dairy" ${safeAisle === "dairy" ? "selected" : ""}>🥛 Молочні та яйця</option>
          <option value="canned" ${safeAisle === "canned" ? "selected" : ""}>🥫 Консерви</option>
          <option value="fish" ${safeAisle === "fish" ? "selected" : ""}>🐟 Риба</option>
          <option value="spices" ${safeAisle === "spices" ? "selected" : ""}>🧂 Спеції та олія</option>
          <option value="bakery" ${safeAisle === "bakery" ? "selected" : ""}>🧁 Випічка</option>
          <option value="other" ${safeAisle === "other" ? "selected" : ""}>📦 Інше</option>
        </select>
        <button type="button" class="remove-row-btn text-zinc-400 hover:text-red-500 p-1 shrink-0 active:scale-90 transition-transform">
          <i data-lucide="trash-2" class="w-4 h-4"></i>
        </button>
      `;

      const inputName = row.querySelector(".ing-name");
      const listContainer = row.querySelector(".ing-autocomplete-list");
      const aisleSelect = row.querySelector(".ing-aisle");

      const updateAisleTitle = () => {
        const selectedOption = aisleSelect.options[aisleSelect.selectedIndex];
        if (selectedOption) {
          aisleSelect.title = selectedOption.text;
        }
      };
      updateAisleTitle();
      aisleSelect.addEventListener("change", updateAisleTitle);

      // Логіка автокомпліту
      const hideList = () => {
        listContainer.classList.add("hidden");
        listContainer.innerHTML = "";
      };

      inputName.addEventListener("input", () => {
        const query = inputName.value;
        const matches = searchIngredients(query);

        if (!query.trim()) {
          hideList();
          return;
        }

        if (matches.length === 0) {
          listContainer.innerHTML = `
            <div class="px-3 py-2 text-xs text-zinc-400 dark:text-zinc-500 italic select-none">
              Новий інгредієнт
            </div>
          `;
          listContainer.classList.remove("hidden");
          return;
        }

        listContainer.innerHTML = matches.map(item => {
          return `
            <div data-prod-name="${item.name}" data-prod-category="${item.category}" class="autocomplete-item flex items-center justify-between px-3 py-2 text-sm rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800 cursor-pointer transition-colors group">
              <span class="font-medium text-zinc-900 dark:text-white whitespace-nowrap">${item.name}</span>
              <button 
                type="button" 
                class="edit-synonyms-btn p-1 rounded text-zinc-400 hover:text-zinc-700 dark:hover:text-white hover:bg-zinc-200 dark:hover:bg-zinc-700/60 transition-colors"
                title="Редагувати синоніми"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
                </svg>
              </button>
            </div>
          `;
        }).join("");

        listContainer.querySelectorAll(".autocomplete-item").forEach((itemEl, idx) => {
          const itemData = matches[idx];

          const editBtn = itemEl.querySelector(".edit-synonyms-btn");
          if (editBtn) {
            editBtn.addEventListener("mousedown", (e) => {
              e.preventDefault();
              e.stopPropagation();
            });
            editBtn.addEventListener("click", (e) => {
              e.preventDefault();
              e.stopPropagation();
              hideList();
              openSynonymsModal(itemData);
            });
          }

          itemEl.addEventListener("mousedown", (e) => {
            if (e.target.closest(".edit-synonyms-btn")) return;
            e.preventDefault();
            const chosenName = itemEl.getAttribute("data-prod-name");
            const chosenCategory = itemEl.getAttribute("data-prod-category");

            // Підставляємо назву строго українською мовою
            inputName.value = chosenName;

            // Перемикаємо селектор відділу на відповідну категорію
            let mappedAisleKey = CATEGORY_TO_AISLE_KEY[chosenCategory] || "other";
            if (mappedAisleKey === "cheese") mappedAisleKey = "dairy";
            if (mappedAisleKey === "vegetables" || mappedAisleKey === "fruits") mappedAisleKey = "produce";

            if (mappedAisleKey && aisleSelect.querySelector(`option[value="${mappedAisleKey}"]`)) {
              aisleSelect.value = mappedAisleKey;
              updateAisleTitle();
            }
            hideList();
          });
        });

        listContainer.classList.remove("hidden");
      });

      inputName.addEventListener("blur", () => {
        setTimeout(hideList, 200);
      });

      row.querySelector(".remove-row-btn").addEventListener("click", () => {
        row.remove();
      });

      container.appendChild(row);
      lucide.createIcons();
    }

    function renderCategorySelectOptions(selectedId = "") {
      const select = document.getElementById("recipeCategorySelect");
      const placeholderOption = `<option value="" ${!selectedId ? "selected" : ""} disabled>Оберіть категорію...</option>`;
      const catOptions = categories.map(c => `
        <option value="${c.id}" ${c.id === selectedId ? "selected" : ""}>
          ${c.icon ? c.icon + " " : ""}${c.name}
        </option>
      `).join("");
      select.innerHTML = placeholderOption + catOptions;
    }

    function openEditRecipeModal(recipe) {
      document.getElementById("recipeModalFormTitle").innerText = "Редагувати рецепт";
      document.getElementById("editingRecipeId").value = recipe.id;
      document.getElementById("recipeTitleInput").value = recipe.title;
      document.getElementById("recipePortionsInput").value = recipe.portions || 1;
      updateIngredientsBlockLabel(recipe.portions || 1);
      document.getElementById("recipeTimeInput").value = recipe.time || "";
      document.getElementById("recipeInstructionsInput").value = recipe.instructions || "";
      
      renderCategorySelectOptions(recipe.categoryId);

      const container = document.getElementById("ingredientsListContainer");
      container.innerHTML = "";
      if (recipe.ingredients && recipe.ingredients.length > 0) {
        recipe.ingredients.forEach(i => {
          addIngredientRow(i.name, i.amount, i.unit, i.aisle || "");
        });
      } else {
        addIngredientRow("", "", "г", "");
      }

      uploadedImageBase64 = recipe.image || "";
      if (uploadedImageBase64) {
        document.getElementById("imagePreviewBox").innerHTML = `<img src="${uploadedImageBase64}" class="w-full h-full object-cover">`;
        document.getElementById("uploadLabelText").innerText = "Змінити фото";
      } else {
        resetImageUpload();
      }

      openModal("newRecipeModal");
    }

    function resetImageUpload() {
      uploadedImageBase64 = "";
      document.getElementById("imagePreviewBox").innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-orange-500 stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
          <circle cx="12" cy="13" r="3"/>
        </svg>
      `;
      const label = document.getElementById("uploadLabelText");
      if (label) label.innerText = "Обрати фото...";
      const fileInput = document.getElementById("recipeImageFileInput");
      if (fileInput) fileInput.value = "";
    }

    function updateIngredientsBlockLabel(portions) {
      const label = document.getElementById("ingredientsBlockLabel");
      if (label) {
        const p = parseInt(portions) || 1;
        label.innerText = `Інгредієнти (на ${p} порц.) *`;
      }
    }

    // 10. КЕРУВАННЯ КАТЕГОРІЯМИ ТА SVG-ПЛЕЙСХОЛДЕРИ
    function setupEmojiInputs() {
      const newCatInput = document.getElementById("newCatIconInput");
      const newCatPlaceholder = document.getElementById("newCatIconPlaceholder");
      const newCatNameInput = document.getElementById("newCatNameInput");
      const addBtn = document.getElementById("addNewCategoryBtn");

      newCatInput.addEventListener("input", () => {
        newCatPlaceholder.style.opacity = newCatInput.value.trim().length > 0 ? "0" : "1";
      });

      newCatNameInput.addEventListener("input", () => {
        const hasText = newCatNameInput.value.trim().length > 0;
        addBtn.disabled = !hasText;
        addBtn.style.opacity = hasText ? "1" : "0.4";
      });

      const editCatInput = document.getElementById("editCatIconInput");
      const editCatPlaceholder = document.getElementById("editCatIconPlaceholder");
      editCatInput.addEventListener("input", () => {
        editCatPlaceholder.style.opacity = editCatInput.value.trim().length > 0 ? "0" : "1";
      });
    }

    function renderCategoriesManagerList() {
      const container = document.getElementById("categoriesManagerList");
      container.innerHTML = categories.map(cat => {
        const dishCount = recipes.filter(r => r.categoryId === cat.id).length;
        const iconDisplay = cat.icon
          ? `<span class="text-xl w-7 text-center">${cat.icon}</span>`
          : `<div class="w-7 flex items-center justify-center text-zinc-400"><i data-lucide="tag" class="w-4 h-4"></i></div>`;

        return `
          <div class="flex items-center justify-between p-2.5 rounded-xl bg-zinc-50 dark:bg-[#1a1c21] border border-zinc-200 dark:border-zinc-800 gap-2">
            <div class="flex items-center gap-2 flex-1 min-w-0">
              ${iconDisplay}
              <div class="min-w-0 flex-1">
                <span class="text-xs font-bold text-zinc-900 dark:text-white block truncate">${cat.name}</span>
                <span class="text-[10px] text-zinc-400">${dishCount} ${pluralize(dishCount, ['страва', 'страви', 'страв'])}</span>
              </div>
            </div>

            <div class="flex items-center gap-1 shrink-0">
              <button type="button" data-cat-id="${cat.id}" class="edit-cat-btn text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200 p-1.5 rounded-lg active:scale-90">
                <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
              </button>
              <button type="button" data-cat-id="${cat.id}" class="del-cat-btn text-zinc-400 hover:text-red-500 p-1.5 rounded-lg active:scale-90">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>
        `;
      }).join("");

      lucide.createIcons();

      container.querySelectorAll(".edit-cat-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const cat = categories.find(c => c.id === btn.dataset.catId);
          if (!cat) return;
          document.getElementById("editCatIdInput").value = cat.id;
          document.getElementById("editCatNameInput").value = cat.name;
          const iconInput = document.getElementById("editCatIconInput");
          iconInput.value = cat.icon || "";
          document.getElementById("editCatIconPlaceholder").style.opacity = iconInput.value.trim().length > 0 ? "0" : "1";
          openModal("editCatModal");
        });
      });

      container.querySelectorAll(".del-cat-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.catId;
          if (categories.length <= 1) return;
          categories = categories.filter(c => c.id !== id);
          recipes = recipes.filter(r => r.categoryId !== id);
          saveCategories();
          saveRecipes();
          renderCategoriesManagerList();
          renderCategoryTabs();
          renderMenuFeed();
        });
      });
    }

    function safeCreateIcons() {
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        try {
          window.lucide.createIcons();
        } catch (e) {
          console.warn("Lucide icons error:", e);
        }
      }
    }

    // 11. ІНІЦІАЛІЗАЦІЯ ДОДАТКА
    function initApp() {
      try {
        setupTheme();
        setupModals();
        setupEmojiInputs();
        setupStrictScrollSpy();

        renderCategoryTabs();
        renderMenuFeed();
        updateFloatingCartBadge();

        // Відкриття кошика
        document.getElementById("openShoppingModalBtn")?.addEventListener("click", () => {
          renderShoppingListModal();
          openModal("shoppingModal");
        });

        // Експорт у Telegram
        document.getElementById("telegramExportBtn")?.addEventListener("click", () => {
          const text = generateTelegramText();
          const encodedText = encodeURIComponent(text);
          const deepLink = `tg://msg_url?url=&text=${encodedText}`;
          const webFallback = `https://t.me/share/url?url=&text=${encodedText}`;

          let appOpened = false;
          const handleVisibilityChange = () => {
            if (document.hidden) appOpened = true;
          };
          document.addEventListener("visibilitychange", handleVisibilityChange);

          window.location.href = deepLink;

          setTimeout(() => {
            document.removeEventListener("visibilitychange", handleVisibilityChange);
            if (!appOpened) {
              window.open(webFallback, "_blank");
            }
          }, 650);
        });

        // Копіювання списку
        document.getElementById("copyShoppingListBtn")?.addEventListener("click", () => {
          const text = generateTelegramText();
          const el = document.createElement("textarea");
          el.value = text;
          document.body.appendChild(el);
          el.select();
          document.execCommand("copy");
          document.body.removeChild(el);

          const btn = document.getElementById("copyShoppingListBtn");
          if (btn) {
            const orig = btn.innerHTML;
            btn.innerHTML = `<span>Скопійовано!</span>`;
            setTimeout(() => { btn.innerHTML = orig; }, 1500);
          }
        });

        // Відкриття категорій
        document.getElementById("openCategoriesModalBtn")?.addEventListener("click", () => {
          renderCategoriesManagerList();
          openModal("categoriesModal");
        });

        // Додавання нової категорії
        document.getElementById("addNewCategoryBtn")?.addEventListener("click", () => {
          const nameInput = document.getElementById("newCatNameInput");
          const iconInput = document.getElementById("newCatIconInput");
          const name = nameInput ? nameInput.value.trim() : "";
          const icon = iconInput ? iconInput.value.trim() : "";

          if (!name) return;

          categories.push({
            id: `cat-${Date.now()}`,
            name: name,
            icon: icon || ""
          });

          saveCategories();

          if (nameInput) nameInput.value = "";
          if (iconInput) iconInput.value = "";
          const placeholder = document.getElementById("newCatIconPlaceholder");
          if (placeholder) placeholder.style.opacity = "1";
          const addBtn = document.getElementById("addNewCategoryBtn");
          if (addBtn) {
            addBtn.disabled = true;
            addBtn.style.opacity = "0.4";
          }

          renderCategoriesManagerList();
          renderCategoryTabs();
          renderMenuFeed();
        });

        // Збереження редагованої категорії
        document.getElementById("saveEditCatBtn")?.addEventListener("click", () => {
          const id = document.getElementById("editCatIdInput")?.value;
          const name = document.getElementById("editCatNameInput")?.value.trim();
          const icon = document.getElementById("editCatIconInput")?.value.trim();

          if (!name) return;

          const cat = categories.find(c => c.id === id);
          if (cat) {
            cat.name = name;
            cat.icon = icon || "";
            saveCategories();
            renderCategoriesManagerList();
            renderCategoryTabs();
            renderMenuFeed();
          }
          closeModal("editCatModal");
        });

        // Збереження синонімів продукту
        document.getElementById("addSynonymRowBtn")?.addEventListener("click", () => {
          addSynonymInputRow("", true);
        });

        document.getElementById("saveSynonymsBtn")?.addEventListener("click", () => {
          if (!activeEditingProductForSynonyms) return;

          const rows = document.querySelectorAll("#synonymsListContainer .synonym-input");
          const newAliases = [];
          rows.forEach(input => {
            const clean = input.value.trim().toLowerCase();
            if (clean && !newAliases.includes(clean)) {
              newAliases.push(clean);
            }
          });

          const list = getStoredIngredients();
          const existingIdx = list.findIndex(p => p.name.toLowerCase() === activeEditingProductForSynonyms.name.toLowerCase());

          if (existingIdx >= 0) {
            list[existingIdx].aliases = newAliases;
          } else {
            list.push({
              name: activeEditingProductForSynonyms.name,
              category: activeEditingProductForSynonyms.category || "Інше",
              aliases: newAliases
            });
          }

          localStorage.setItem("menushka_custom_ingredients", JSON.stringify(list));
          activeEditingProductForSynonyms.aliases = newAliases;
          closeModal("synonymsModal");
        });

        // Фото в рецепті
        document.getElementById("recipeImageFileInput")?.addEventListener("change", (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (evt) => {
            uploadedImageBase64 = evt.target.result;
            const previewBox = document.getElementById("imagePreviewBox");
            if (previewBox) {
              previewBox.innerHTML = `<img src="${uploadedImageBase64}" class="w-full h-full object-cover">`;
            }
            const labelText = document.getElementById("uploadLabelText");
            if (labelText) labelText.innerText = "Змінити фото";
          };
          reader.readAsDataURL(file);
        });

        // Додати рядок інгредієнта
        document.getElementById("addIngredientRowBtn")?.addEventListener("click", () => {
          addIngredientRow("", "", "г", "");
        });

        // Слухач зміни кількості порцій для динамічного оновлення лейбла
        document.getElementById("recipePortionsInput")?.addEventListener("input", (e) => {
          updateIngredientsBlockLabel(e.target.value);
        });

        // Збереження форми рецепту
        document.getElementById("newRecipeForm")?.addEventListener("submit", (e) => {
          e.preventDefault();
          const editId = document.getElementById("editingRecipeId")?.value;
          const title = document.getElementById("recipeTitleInput")?.value.trim();
          const categoryId = document.getElementById("recipeCategorySelect")?.value;
          const portionsRaw = document.getElementById("recipePortionsInput")?.value;
          const portions = parseInt(portionsRaw);
          const timeRaw = document.getElementById("recipeTimeInput")?.value;
          const time = timeRaw ? (parseInt(timeRaw) || 0) : 0;
          const instructions = document.getElementById("recipeInstructionsInput")?.value.trim();

          if (!title) {
            alert("Будь ласка, вкажіть назву страви.");
            return;
          }

          if (!categoryId) {
            alert("Будь ласка, оберіть категорію страви.");
            return;
          }

          if (!portions || portions < 1) {
            alert("Будь ласка, вкажіть дійсну кількість порцій (мінімум 1).");
            return;
          }

          const ingredients = [];
          let hasInvalidAisle = false;

          document.querySelectorAll("#ingredientsListContainer .ingredient-input-row").forEach(row => {
            const name = row.querySelector(".ing-name")?.value.trim();
            const amount = parseFloat(row.querySelector(".ing-amount")?.value) || 0;
            const unit = row.querySelector(".ing-unit")?.value || "г";
            const aisle = row.querySelector(".ing-aisle")?.value || "";

            if (name) {
              if (!aisle) {
                hasInvalidAisle = true;
              }
              ingredients.push({ name, amount, unit, aisle: aisle || "other" });
              if (aisle) {
                saveCustomIngredient(name, aisle);
              }
            }
          });

          if (ingredients.length === 0) {
            alert("Будь ласка, додайте хоча б один інгредієнт.");
            return;
          }

          if (hasInvalidAisle) {
            alert("Будь ласка, оберіть відділ супермаркету для всіх вказаних інгредієнтів.");
            return;
          }

          if (editId) {
            const rec = recipes.find(r => r.id === editId);
            if (rec) {
              rec.title = title;
              rec.categoryId = categoryId;
              rec.portions = portions;
              rec.time = time;
              rec.instructions = instructions;
              rec.ingredients = ingredients;
              if (uploadedImageBase64 !== undefined) rec.image = uploadedImageBase64;
            }
          } else {
            recipes.push({
              id: `rec-${Date.now()}`,
              categoryId,
              title,
              portions,
              time,
              image: uploadedImageBase64 || "",
              instructions,
              ingredients
            });
          }

          saveRecipes();
          renderMenuFeed();
          closeModal("newRecipeModal");
        });

        // Відкрити модалку створення рецепту
        document.getElementById("openNewRecipeBtn")?.addEventListener("click", () => {
          const formTitle = document.getElementById("recipeModalFormTitle");
          if (formTitle) formTitle.innerText = "Додати свій рецепт";
          const editInput = document.getElementById("editingRecipeId");
          if (editInput) editInput.value = "";
          const form = document.getElementById("newRecipeForm");
          if (form) form.reset();
          const titleInput = document.getElementById("recipeTitleInput");
          if (titleInput) titleInput.value = "";
          const portionsInput = document.getElementById("recipePortionsInput");
          if (portionsInput) portionsInput.value = "";
          updateIngredientsBlockLabel(1);
          const timeInput = document.getElementById("recipeTimeInput");
          if (timeInput) timeInput.value = "";
          const instructions = document.getElementById("recipeInstructionsInput");
          if (instructions) instructions.value = "";
          renderCategorySelectOptions("");

          const container = document.getElementById("ingredientsListContainer");
          if (container) container.innerHTML = "";
          resetImageUpload();

          // Додаємо рівно 1 чистий рядок інгредієнта без дефолтних продуктів
          addIngredientRow("", "", "г", "");
          openModal("newRecipeModal");
        });

        // Перемикач вкладок у деталях страви
        document.getElementById("tabBtnIngredients")?.addEventListener("click", () => switchModalTab("ingredients"));
        document.getElementById("tabBtnInstructions")?.addEventListener("click", () => switchModalTab("instructions"));

        safeCreateIcons();
      } catch (err) {
        console.error("Помилка під час запуску initApp:", err);
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initApp);
    } else {
      initApp();
    }
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((err) => {
          console.log('SW registration error:', err);
        });
      });
    }
  </script>
</body>
</html>
